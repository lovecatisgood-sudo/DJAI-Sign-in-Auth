services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: djai_identity
      POSTGRES_USER: djai_identity
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djai_identity -d djai_identity"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - djai_identity_postgres:/var/lib/postgresql/data

volumes:
  djai_identity_postgres:
